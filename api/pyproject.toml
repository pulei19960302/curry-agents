[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curry-agent-api"
version = "0.1.0"
description = "FastAPI backend service for CurryAgent."
requires-python = ">3.11"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "pydantic-settings>=2.7,<3.0",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "redis==8.1.0",
    "beautifulsoup4>=4.12,<5.0",
    "pypdf>=5,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
