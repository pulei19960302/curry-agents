[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curry-agent-api"
version = "0.1.0"
description = "FastAPI backend service for CurryAgent."
requires-python = ">3.11"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings>=2.7,<3.0",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg>=0.30.0,<1.0",
    "alembic==1.20.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "redis==8.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
