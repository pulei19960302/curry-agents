[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name="curry-agent-api"
version="0.1.0"
description = "FastAPI backend service for CurryAgent."
requires-python = ">3.11"
dependencies = [
    "fastapi>0.115,<1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7,<3.0",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
