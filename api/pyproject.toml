[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name="curry-agent-api"
version="0.1.0"
description = "FastAPI backend service for CurryAgent."
requires-python = ">3.11"
dependencies = [
    "fastapi>0.115,<1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7,<3.0",
    "starlette>=1.6.0",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.16,<2.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "redis>5.2,<6.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
    "opentelemetry-instrumentation-redis>=0.49b0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
