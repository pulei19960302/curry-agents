mcp:
  enabled: true
  default_server: demo  # 默认 MCP Server。本章默认使用内置 demo


servers:
  demo:
    enabled: true
    transport: demo  # 使用 demo 传输，表示不连接外部服务
    description: "内置 MCP 演示 Server，用于第 32 章验证工具发现和调用链路。"

  example_stdio:
    enabled: false
    transport: stdio
    command: "python"
    args:
      - "-m"
      - "your_mcp_server"
    description: "stdio MCP Server 配置示例。启用前需要替换成真实命令。"

  example_http:
    enabled: false  # 是否启用该 Server
    transport: streamable_http
    url: "http://localhost:8765/mcp"
    description: "Streamable HTTP MCP Server 配置示例。启用前需要替换成真实地址。"

